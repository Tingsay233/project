name: Build APK

on:
  workflow_dispatch:
  push:
    paths: ["public/**", "android-app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # 把你的服务器网址写进 App（在仓库 Settings → Secrets and variables → Actions → Variables 里加 SERVER_URL）
      - name: Inject server URL
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          echo "window.APP_CONFIG = { apiBase: \"$SERVER_URL\" };" > public/config.js

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          mkdir www && cp -r ../public/* www/
          npx cap add android
          npx cap sync android
          # 拍照需要相机权限
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LightCal-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
