name: Build APK

on:
  workflow_dispatch:
  push:
    paths: ["public/**", "android-app/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write   # 用来发布 Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # 把你的服务器网址写进 App（在仓库 Settings → Secrets and variables → Actions → Variables 里加 SERVER_URL）
      - name: Inject server URL
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          echo "window.APP_CONFIG = { apiBase: \"$SERVER_URL\", build: $BUILD, repo: \"$REPO\" };" > public/config.js

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          mkdir www && cp -r ../public/* www/
          npx cap add android
          npx cap sync android
          # 拍照需要相机权限
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      # 每次构建的版本号递增，系统才会把新包当成「更新」而不是冲突
      - name: Set version code
        env:
          BUILD: ${{ github.run_number }}
        run: |
          F=android-app/android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $BUILD/; s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD\"/" $F
          grep -nE "versionCode|versionName" $F

      # 固定签名：直接写进 Gradle 的 debug 签名配置（只复制到 ~/.android 在 CI 上没有生效）
      - name: Pin signing key
        run: |
          python3 - <<'PY'
          p = "android-app/android/app/build.gradle"
          s = open(p).read()
          cfg = """android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }"""
          assert "android {" in s
          s = s.replace("android {", cfg, 1)
          open(p, "w").write(s)
          PY
          sed -n '/^android {/,/^    namespace/p' android-app/android/app/build.gradle

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      # 检查：APK 必须用固定钥匙签名，否则让构建失败（宁可没有新版，也不发出会「冲突」的版本）
      - name: Verify APK signature
        run: |
          EXPECT=$(keytool -list -keystore android-app/debug.keystore -storepass android | grep "SHA-256" | sed 's/.*: //')
          GOT=$(keytool -printcert -jarfile android-app/android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "expected: $EXPECT"
          echo "got:      $GOT"
          if [ -z "$EXPECT" ] || [ "$EXPECT" != "$GOT" ]; then echo "::error::APK is not signed with the fixed key"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: LightCal-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      # 发布到 GitHub Releases：App 里的「检查更新」就是读取这里的最新版本
      - name: Prepare release file
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk LightCal.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LightCal build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: LightCal.apk
          make_latest: "true"
          body: "自动构建的安卓安装包（debug 版）。已安装旧版的话，直接下载安装即可覆盖更新，记录不会丢。"
