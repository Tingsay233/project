name: Build APK

on:
  workflow_dispatch:
  push:
    paths: ["public/**", "android-app/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write   # 用来发布 Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # 把你的服务器网址写进 App（在仓库 Settings → Secrets and variables → Actions → Variables 里加 SERVER_URL）
      - name: Inject server URL
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          echo "window.APP_CONFIG = { apiBase: \"$SERVER_URL\", build: $BUILD, repo: \"$REPO\" };" > public/config.js

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          mkdir www && cp -r ../public/* www/
          npx cap add android
          npx cap sync android
          # 拍照需要相机权限
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      # 固定签名：每次构建用同一把 debug 钥匙，新版 APK 才能直接覆盖安装旧版（不丢数据）
      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp android-app/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LightCal-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      # 发布到 GitHub Releases：App 里的「检查更新」就是读取这里的最新版本
      - name: Prepare release file
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk LightCal.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LightCal build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: LightCal.apk
          make_latest: "true"
          body: "自动构建的安卓安装包（debug 版）。已安装旧版的话，直接下载安装即可覆盖更新，记录不会丢。"
