<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<script src="config.js"></script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LightCal">
<title>轻卡 LightCal</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#1c2b22;--sub:#6b7a70;--line:#e3e9e4;--g:#16a34a;--g2:#dcfce7;--warn:#f59e0b;--bad:#dc2626;--p:#3b82f6;--c:#f59e0b;--f:#ec4899}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231c;--ink:#e8f1ea;--sub:#93a69a;--line:#26352b;--g2:#143824}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 10px}
.lang{position:fixed;top:12px;right:12px;z-index:5;background:var(--g2);color:var(--g);width:auto;padding:5px 12px;font-size:13px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:10px}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:4px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;width:100%}
button.sm{width:auto;padding:6px 12px;font-size:14px}button:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--sub);border-radius:0;font-size:11px;padding:8px 0;font-weight:500}
nav button.on{color:var(--g);font-weight:700}nav span{display:block;font-size:21px}
.tab{display:none}.tab.on{display:block}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:32px;line-height:1.1}.ring small{color:var(--sub)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:99px}
.mac{font-size:13px;color:var(--sub)}.mac div{display:flex;justify-content:space-between}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{color:var(--sub);display:block}
.x{background:none;color:var(--sub);width:auto;padding:4px 8px}
.drop{display:block;border:2px dashed var(--g);border-radius:16px;padding:28px 12px;text-align:center;color:var(--g);background:var(--g2);cursor:pointer}
.drop span{font-size:44px;display:block}
#preview{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:12px;display:none}
.tip{background:var(--g2);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.big{font-size:34px;font-weight:800;color:var(--g)}
.muted{color:var(--sub);font-size:13px}
ul.g{padding-left:20px;margin:6px 0}ul.g li{margin:4px 0}
.plate{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:12px;color:#fff;font-weight:600}
.plate div{display:flex;align-items:center;justify-content:center}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.meal{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.meal:last-child{border:0}
.disc{font-size:12px;color:var(--sub);text-align:center;margin:18px 0}
.stats{display:flex;text-align:center;gap:8px;margin-bottom:6px}.stats>div{flex:1}.stats b{font-size:20px;display:block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--sub);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);justify-content:center;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;padding:0;border-radius:99px;background:var(--g2);color:var(--g);font-size:18px;line-height:1}
.step em{font-style:normal;min-width:44px;text-align:center;font-size:13px;font-weight:700}
.item.off{opacity:.4}.item.off .nm{text-decoration:line-through}
.adj{font-size:12px;color:var(--sub);margin:6px 0 0}
.link{background:none;color:var(--g);width:auto;padding:4px 0;font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;background:var(--g2);color:var(--ink);border-radius:99px;padding:4px 4px 4px 12px;font-size:14px;gap:6px}
.chip b{cursor:pointer}.chip small{color:var(--sub)}.chip .x{padding:2px 8px}
.down{color:var(--g)}.up{color:var(--bad)}
</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()"></button>
<main>

<!-- TODAY -->
<section class="tab on" id="t-today">
  <div class="top"><h1 data-i18n="h_today"></h1></div>
  <div class="card" id="noProfile" style="display:none">
    <h2 data-i18n="setgoal_h"></h2>
    <p class="muted" data-i18n="setgoal_p"></p>
    <button onclick="go('plan')" data-i18n="setgoal_btn"></button>
  </div>
  <div class="card">
    <div class="ring">
      <svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="arc" cx="85" cy="85" r="74" fill="none" stroke="var(--g)" stroke-width="14" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"/></svg>
      <div class="t"><small data-i18n="left"></small><b id="leftN">--</b><small><span data-i18n="kcal_goal"></span> <span id="goal">--</span></small></div>
    </div>
    <div style="margin-top:16px" class="mac">
      <div><span data-i18n="protein"></span><span id="mp"></span></div><div class="bar"><i id="bp" style="background:var(--p);width:0"></i></div>
      <div><span data-i18n="carbs"></span><span id="mc"></span></div><div class="bar"><i id="bc" style="background:var(--c);width:0"></i></div>
      <div><span data-i18n="fat"></span><span id="mf"></span></div><div class="bar"><i id="bf" style="background:var(--f);width:0"></i></div>
    </div>
  </div>
  <div class="card"><h2 data-i18n="ate_h"></h2><div id="log"></div>
    <div id="empty" class="muted" style="padding:6px 0" data-i18n="ate_empty"></div>
  </div>
  <div class="card"><h2 data-i18n="fav_h"></h2><div id="favs" class="chips"></div><div id="favEmpty" class="muted" data-i18n="fav_empty"></div></div>
  <div class="card"><h2 data-i18n="manual_h"></h2>
    <div class="row"><select id="foodSel"></select><button class="sm" style="flex:0 0 auto" onclick="addManual()" data-i18n="add"></button></div>
  </div>
</section>

<!-- SNAP -->
<section class="tab" id="t-snap">
  <div class="top"><h1 data-i18n="h_snap"></h1></div>
  <div class="card">
    <img id="preview" alt="">
    <label class="drop" for="file"><span>📷</span><b data-i18n="snap_btn"></b></label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <div id="aiOff" class="err" style="display:none"></div>
    <div id="busy" class="muted" style="display:none;margin-top:10px" data-i18n="busy"></div>
    <div id="err" class="err"></div>
    <div id="pwBox" style="display:none;margin-top:10px">
      <label><span data-i18n="pw_need"></span><input id="pwIn" type="password" autocomplete="current-password"></label>
      <button onclick="unlock()" data-i18n="pw_unlock"></button>
    </div>
  </div>
  <div class="card" id="result" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div><h2 id="rDish" style="margin:0"></h2><span class="muted" id="rConf"></span></div>
      <div style="text-align:right"><div class="big" id="rKcal"></div><span class="muted" data-i18n="kcal"></span></div>
    </div>
    <div class="adj" data-i18n="adj_hint"></div>
    <div id="rItems" style="margin-top:4px"></div>
    <button class="link" onclick="resetItems()" data-i18n="reset"></button>
    <div class="muted" id="rMac" style="margin-top:8px"></div>
    <div class="tip" id="rTip"></div>
    <div class="row" style="margin-top:12px">
      <select id="rMeal"></select>
      <button onclick="saveResult()" data-i18n="log_it"></button>
    </div>
    <button class="link" style="margin-top:6px" onclick="favResult()" data-i18n="fav_this"></button>
  </div>
</section>

<!-- PROGRESS -->
<section class="tab" id="t-prog">
  <div class="top"><h1 data-i18n="h_prog"></h1></div>
  <div class="card">
    <div class="row">
      <label><span data-i18n="date"></span><input id="wDate" type="date"></label>
      <label><span data-i18n="weight_kg"></span><input id="wKg" type="number" inputmode="decimal" step="0.1" placeholder="0.0"></label>
    </div>
    <button onclick="addWeight()" data-i18n="log_weight"></button>
    <div class="muted" style="margin-top:8px" data-i18n="weigh_tip"></div>
  </div>
  <div class="card">
    <div class="stats" id="wStats"></div>
    <div id="chartBox"></div>
    <div class="legend"><span><i style="background:var(--g)"></i><span data-i18n="lg_actual"></span></span><span><i style="background:var(--p);opacity:.6"></i><span data-i18n="lg_plan"></span></span><span><i style="background:var(--warn)"></i><span data-i18n="lg_target"></span></span></div>
    <div id="wMsg" class="tip" style="display:none"></div>
  </div>
  <div class="card"><h2 data-i18n="history"></h2><div id="wList"></div></div>
</section>

<!-- PLAN -->
<section class="tab" id="t-plan">
  <div class="top"><h1 data-i18n="h_plan"></h1></div>
  <div class="card">
    <div class="row">
      <label><span data-i18n="sex"></span><select id="sex"><option value="m" data-i18n="male"></option><option value="f" data-i18n="female"></option></select></label>
      <label><span data-i18n="age"></span><input id="age" type="number" inputmode="numeric" value="25"></label>
    </div>
    <div class="row">
      <label><span data-i18n="height"></span><input id="height" type="number" inputmode="decimal" value="165"></label>
      <label><span data-i18n="weight_now"></span><input id="weight" type="number" inputmode="decimal" value="70"></label>
    </div>
    <div class="row">
      <label><span data-i18n="target"></span><input id="target" type="number" inputmode="decimal" value="60"></label>
      <label><span data-i18n="pace"></span><select id="pace"><option value="0.25" data-i18n="pace1"></option><option value="0.5" selected data-i18n="pace2"></option><option value="0.75" data-i18n="pace3"></option></select></label>
    </div>
    <label><span data-i18n="act"></span><select id="act">
      <option value="1.2" data-i18n="act1"></option><option value="1.375" selected data-i18n="act2"></option>
      <option value="1.55" data-i18n="act3"></option><option value="1.725" data-i18n="act4"></option></select></label>
    <button onclick="saveProfile()" data-i18n="calc_btn"></button>
  </div>
  <div id="planOut" style="display:none">
    <div class="card">
      <div class="muted" data-i18n="eat_per_day"></div>
      <div class="big"><span id="pGoal"></span> <span data-i18n="kcal"></span></div>
      <div class="muted" id="pWhy"></div>
      <div id="pWarn" class="err"></div>
      <div class="row" style="margin-top:12px;text-align:center">
        <div><b id="pBmr"></b><div class="muted" data-i18n="bmr"></div></div>
        <div><b id="pTdee"></b><div class="muted" data-i18n="tdee"></div></div>
        <div><b id="pWeeks"></b><div class="muted" data-i18n="eta"></div></div>
      </div>
    </div>
    <div class="card"><h2 data-i18n="macros_h"></h2><div class="muted" id="pMacro"></div></div>
    <div class="card"><h2 data-i18n="split_h"></h2><div id="pMeals"></div></div>
  </div>
  <div class="card"><h2 data-i18n="set_h"></h2>
    <label><span data-i18n="set_gkey"></span><input id="gkeySet" type="password" autocomplete="off" placeholder="AIza..."></label>
    <div class="muted" style="margin:-4px 0 10px" data-i18n="set_gkey_help"></div>
    <label id="srvRow" style="display:none"><span data-i18n="set_server"></span><input id="srvIn" type="url" placeholder="https://xxx.onrender.com"></label>
    <label><span data-i18n="set_pw"></span><input id="pwSet" type="password" autocomplete="current-password"></label>
    <button onclick="saveSettings()" data-i18n="set_save"></button>
    <div id="setMsg" class="muted" style="margin-top:8px"></div>
  </div>
</section>

<!-- GUIDE -->
<section class="tab" id="t-guide">
  <div class="top"><h1 data-i18n="h_guide"></h1></div>
  <div id="guideBox"></div>
  <div class="disc" data-i18n-html="disclaimer"></div>
</section>
</main>

<nav>
  <button class="on" data-t="today"><span>🏠</span><i data-i18n="n_today" style="font-style:normal"></i></button>
  <button data-t="snap"><span>📷</span><i data-i18n="n_snap" style="font-style:normal"></i></button>
  <button data-t="prog"><span>📈</span><i data-i18n="n_prog" style="font-style:normal"></i></button>
  <button data-t="plan"><span>🎯</span><i data-i18n="n_plan" style="font-style:normal"></i></button>
  <button data-t="guide"><span>🥗</span><i data-i18n="n_guide" style="font-style:normal"></i></button>
</nav>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const guessMeal = () => { const h=new Date().getHours(); return h<10?0:h<15?1:h<20?2:3; };

// ================= plan =================
function calc(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="m"?5:-161);
  const tdee = bmr * p.act;
  const deficit = p.pace * 7700 / 7;
  const floor = p.sex==="m"?1500:1200;
  let goal = Math.round((tdee - deficit)/10)*10;
  let warn = "";
  if (goal < floor){ goal = floor; warn = t("warn_floor")(floor); }
  const realDeficit = tdee - goal;
  const lose = p.weight - p.target;
  const weeks = lose>0 && realDeficit>0 ? Math.ceil(lose*7700/(realDeficit*7)) : 0;
  if (lose<=0) warn = t("warn_gain");
  const protein = Math.round(p.weight*1.6), fat = Math.round(goal*0.25/9);
  const carbs = Math.max(0, Math.round((goal - protein*4 - fat*9)/4));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), goal, weeks, protein, fat, carbs, warn, deficit:Math.round(realDeficit), kgPerWeek: realDeficit*7/7700};
}
function saveProfile(){
  const p = {sex:$("sex").value, age:+$("age").value, height:+$("height").value, weight:+$("weight").value,
    target:+$("target").value, pace:+$("pace").value, act:+$("act").value};
  if (!(p.age>10&&p.age<100&&p.height>100&&p.height<230&&p.weight>30&&p.weight<250&&p.target>30)) { alert(t("bad_input")); return; }
  if (p.age<18 && !confirm(t("minor"))) return;
  profile = p; store.set("profile", p);
  if (!weights.length) { weights.push({date:today(), kg:p.weight}); store.set("weights", weights); }
  renderPlan(); render(); renderProgress();
}
function renderPlan(){
  if (!profile) return;
  for (const k in profile) $(k).value = profile[k];
  const r = calc(profile);
  $("planOut").style.display = "block";
  $("pGoal").textContent = r.goal;
  $("pWhy").textContent = t("why")(r.deficit, r.kgPerWeek.toFixed(2));
  $("pWarn").textContent = r.warn;
  $("pBmr").textContent = r.bmr; $("pTdee").textContent = r.tdee;
  $("pWeeks").textContent = r.weeks ? r.weeks+" "+t("weeks") : "—";
  $("pMacro").innerHTML = t("mac_line")(r.protein, r.carbs, r.fat);
  const share = [.25,.35,.30,.10];
  $("pMeals").innerHTML = t("split").map((n,i)=>`<div class="meal"><span>${n}</span><b>${Math.round(r.goal*share[i]/10)*10} ${t("kcal")}</b></div>`).join("");
}

const dayLog = () => diary[today()] || [];
function addEntry(e){ (diary[today()] ||= []).push(e); store.set("diary", diary); render(); }
function delEntry(i){ diary[today()].splice(i,1); store.set("diary", diary); render(); }
function addManual(){
  const f = FOODS[$("foodSel").value];
  addEntry({name:f[lang==="zh"?0:1], meal:guessMeal(), kcal:f[2], p:f[3], c:f[4], f:f[5]});
}
function render(){
  const log = dayLog();
  const sum = log.reduce((a,e)=>({k:a.k+e.kcal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});
  $("noProfile").style.display = profile ? "none":"block";
  const r = profile ? calc(profile) : {goal:2000,protein:100,carbs:250,fat:60};
  const left = r.goal - Math.round(sum.k);
  $("leftN").textContent = left; $("leftN").style.color = left<0 ? "var(--bad)" : "";
  $("goal").textContent = r.goal;
  const arc = $("arc"); arc.style.strokeDashoffset = 465*(1-Math.min(1, sum.k/r.goal));
  arc.style.stroke = sum.k>r.goal ? "var(--bad)" : sum.k>r.goal*.9 ? "var(--warn)" : "var(--g)";
  [["p","protein"],["c","carbs"],["f","fat"]].forEach(([k,n])=>{
    $("m"+k).textContent = `${Math.round(sum[k])} / ${r[n]} ${t("g")}`;
    $("b"+k).style.width = Math.min(100, sum[k]/r[n]*100)+"%";
  });
  $("empty").style.display = log.length ? "none":"block";
  const meals = t("meals");
  $("log").innerHTML = log.map((e,i)=>`<div class="item"><div><b>${esc(e.name)}</b><small>${meals[e.meal]??""} · ${t("protein")} ${Math.round(e.p)} · ${t("carbs")} ${Math.round(e.c)} · ${t("fat")} ${Math.round(e.f)}</small></div><div><b>${Math.round(e.kcal)}</b> <button class="x" onclick="favEntry(${i})" aria-label="favorite">${isFav(e.name)?"★":"☆"}</button><button class="x" onclick="delEntry(${i})">✕</button></div></div>`).join("");
  renderFavs();
}

function addWeight(){
  const kg = parseFloat($("wKg").value), date = $("wDate").value || today();
  if (!(kg>25 && kg<300)) { alert(t("bad_input")); return; }
  weights = weights.filter(w=>w.date!==date); weights.push({date, kg:Math.round(kg*10)/10});
  weights.sort((a,b)=>a.date.localeCompare(b.date)); store.set("weights", weights);
  if (profile && date===weights[weights.length-1].date) { profile.weight = kg; store.set("profile", profile); renderPlan(); render(); } // 计划按最新体重重算
  $("wKg").value = ""; renderProgress();
}
function delWeight(date){ weights = weights.filter(w=>w.date!==date); store.set("weights", weights); renderProgress(); }
const day = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / 864e5;

function renderProgress(){
  if (!$("wDate").value) $("wDate").value = today();
  const w = weights;
  $("wList").innerHTML = w.length ? [...w].reverse().map((x,i,a)=>{
    const prev = a[i+1]; const d = prev ? x.kg-prev.kg : null;
    return `<div class="item"><div><b>${x.date}</b>${d!==null?`<small class="${d<=0?"down":"up"}">${d>0?"+":""}${d.toFixed(1)} kg</small>`:""}</div><div><b>${x.kg.toFixed(1)} kg</b> <button class="x" onclick="delWeight('${x.date}')">✕</button></div></div>`;
  }).join("") : `<div class="muted">${t("no_weights")}</div>`;
  if (!w.length) { $("wStats").innerHTML = ""; $("chartBox").innerHTML = `<div class="muted" style="text-align:center;padding:30px 0">${t("no_weights")}</div>`; $("wMsg").style.display="none"; return; }

  const first = w[0], cur = w[w.length-1], change = cur.kg-first.kg;
  const togo = profile ? cur.kg - profile.target : null;
  $("wStats").innerHTML = [
    [t("st_start"), first.kg.toFixed(1)],
    [t("st_now"), cur.kg.toFixed(1)],
    [t("st_change"), `<span class="${change<=0?"down":"up"}">${change>0?"+":""}${change.toFixed(1)}</span>`],
    ...(togo!==null ? [[t("st_togo"), togo<=0 ? "🏆" : togo.toFixed(1)]] : [])
  ].map(([l,v])=>`<div><b>${v}</b><span class="muted">${l}</span></div>`).join("");
  $("chartBox").innerHTML = chartSVG(w);

  // 与计划对比的提示
  const msg = $("wMsg");
  if (w.length < 2) { msg.textContent = t("msg_need2"); msg.style.display="block"; return; }
  if (profile && cur.kg <= profile.target) { msg.textContent = t("msg_done"); msg.style.display="block"; return; }
  let text = "";
  const last7 = w.filter(x=>day(x.date) >= day(cur.date)-7);
  if (last7.length>=2) { const d = last7[last7.length-1].kg - last7[0].kg; text += `${t("msg_week")}: ${d>0?"+":""}${d.toFixed(1)} kg. `; }
  if (profile) {
    const days = day(cur.date)-day(first.date);
    const expected = calc(profile).kgPerWeek/7*days, actual = first.kg-cur.kg;
    if (days >= 7) text += actual > expected*1.3 ? t("msg_ahead") : actual < expected*0.6 ? t("msg_behind") : t("msg_on");
  }
  msg.textContent = text; msg.style.display = text ? "block":"none";
}

function chartSVG(w){
  const W=340,H=210,L=34,R=12,T=14,B=26;
  const d0 = day(w[0].date), d1 = Math.max(day(w[w.length-1].date), d0+6);
  const vals = w.map(x=>x.kg); if (profile) vals.push(profile.target);
  let lo = Math.floor(Math.min(...vals)-1), hi = Math.ceil(Math.max(...vals)+1);
  if (hi-lo<4) hi = lo+4;
  const X = d => L + (d-d0)/(d1-d0)*(W-L-R), Y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="weight chart">`;
  for (let i=0;i<=3;i++){ const v = lo+(hi-lo)*i/3, y = Y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3}" text-anchor="end">${v.toFixed(0)}</text>`; }
  const fmt = d => { const x = new Date(d*864e5); return pad(x.getUTCMonth()+1)+"/"+pad(x.getUTCDate()); };
  s += `<text x="${L}" y="${H-8}">${fmt(d0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmt(d1)}</text>`;
  if (profile) {
    const ty = Y(profile.target);
    s += `<line x1="${L}" x2="${W-R}" y1="${ty}" y2="${ty}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    // 计划线：从第一笔体重按计划速度下降，到目标为止
    const rate = calc(profile).kgPerWeek/7;
    if (rate>0) {
      const dEnd = Math.min(d1, d0 + (w[0].kg-profile.target)/rate);
      s += `<line x1="${X(d0)}" y1="${Y(w[0].kg)}" x2="${X(dEnd)}" y2="${Y(w[0].kg-rate*(dEnd-d0))}" stroke="var(--p)" stroke-width="2" stroke-dasharray="2 4" opacity=".7" stroke-linecap="round"/>`;
    }
  }
  const pts = w.map(x=>`${X(day(x.date)).toFixed(1)},${Y(x.kg).toFixed(1)}`);
  if (w.length>1) {
    s += `<polygon points="${X(d0)},${Y(lo)} ${pts.join(" ")} ${X(day(w[w.length-1].date))},${Y(lo)}" fill="var(--g)" opacity=".1"/>`;
    s += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--g)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  w.forEach((x,i)=>{ const [px,py]=pts[i].split(",");
    s += `<circle cx="${px}" cy="${py}" r="${i===w.length-1?5:3.5}" fill="var(--g)" stroke="var(--card)" stroke-width="2"/>`;
    if (i===w.length-1 || i===0) s += `<text x="${px}" y="${+py-9}" text-anchor="${i===0&&w.length>1?"start":"end"}" style="fill:var(--ink);font-weight:700">${x.kg.toFixed(1)}</text>`; });
  return s + "</svg>";
}

// 向 Google 询问「这个密钥现在能用哪些模型」，自动选版本最高的 Flash（模型名以后再变也不用改代码）
async function pickGeminiModel(key){
  const cached = store.get("gmodel","");
  if (cached) return cached;
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", {headers:{"x-goog-api-key":key}});
  const d = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(t("err_key") + (d.error?.message ? " ("+d.error.message.slice(0,80)+")" : ""));
  const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
  const pre = n => /preview|exp/.test(n) ? 1 : 0;
  const c = (d.models||[])
    .filter(x => (x.supportedGenerationMethods||[]).includes("generateContent"))
    .filter(x => /gemini-\d+(\.\d+)?-flash/.test(x.name) && !/image|tts|live|audio|lite|thinking|robotics|computer|embedding/.test(x.name))
    .sort((a,b) => ver(b.name)-ver(a.name) || pre(a.name)-pre(b.name));
  if (!c.length) throw new Error("No usable Gemini Flash model for this key");
  const m = c[0].name.replace(/^models\//,"");
  store.set("gmodel", m); return m;
}
async function geminiDirect(b64, key, retry = true){
  const model = await pickGeminiModel(key);
  const gen = {responseMimeType:"application/json", maxOutputTokens:4096};
  if (model.includes("2.5")) gen.thinkingConfig = {thinkingBudget:0};
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
    method:"POST", headers:{"content-type":"application/json","x-goog-api-key":key},
    body: JSON.stringify({contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:PROMPTS[lang]}]}], generationConfig:gen})});
  const d = await res.json().catch(()=>({}));
  const msg = d.error?.message || "";
  if (!res.ok && retry && (res.status===404 || /no longer available|not found|deprecated|not supported/i.test(msg))) {
    store.set("gmodel",""); return geminiDirect(b64, key, false); // 模型被下线了：重新选一个再试一次
  }
  if (res.status===429) throw new Error(t("err_quota"));
  if (res.status===400 || res.status===403) throw new Error(t("err_key") + (msg ? " ("+msg.slice(0,80)+")" : ""));
  if (!res.ok) throw new Error((msg || t("err_fail")) + " ["+model+"]");
  const txt = (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error(t("err_fail") + " ["+model+"]");
  return JSON.parse(m[0]);
}
async function analyze(){
  $("err").textContent = ""; $("busy").style.display = "block";
  try {
    const gkey = store.get("gkey","");
    if (gkey) { // 直连 Gemini：不需要任何服务器（APK 的默认方式）
      const j = await geminiDirect(pending.split(",")[1], gkey);
      if (!j.is_food) throw new Error(t("err_nofood"));
      last = j; pending = null; showResult(j, true); return;
    }
    if (window.Capacitor && !apiBase()) { go("plan"); throw new Error(t("need_key")); }
    const res = await fetch(apiBase()+"/api/analyze", {method:"POST", headers:authHeaders(),
      body: JSON.stringify({image: pending.split(",")[1], mediaType:"image/jpeg", lang})});
    const j = await res.json().catch(()=>({}));
    if (res.status===401) { $("pwBox").style.display = "block"; $("pwIn").focus(); throw new Error(store.get("pw","") ? t("pw_wrong") : t("pw_need")); }
    if (!res.ok) throw new Error(j.error || t("err_fail"));
    if (!j.is_food) throw new Error(t("err_nofood"));
    last = j; pending = null; showResult(j, true);
  } catch(e){ const offline = /Failed to fetch|Load failed|NetworkError/i.test(e.message);
    $("err").textContent = "❌ " + (offline ? (store.get("gkey","") ? t("err_net") : t("set_fail")) : e.message); }
  finally { $("busy").style.display = "none"; }
}
function unlock(){ store.set("pw", $("pwIn").value); $("pwIn").value = ""; $("pwBox").style.display = "none"; analyze(); }
async function saveSettings(){
  const srv = $("srvIn").value.trim();
  if (window.Capacitor) store.set("apiBase", srv);
  store.set("pw", $("pwSet").value);
  const gk = $("gkeySet").value.trim(); if (gk !== store.get("gkey","")) store.set("gmodel",""); store.set("gkey", gk);
  const m = $("setMsg"); m.textContent = "…";
  if (!gk && window.Capacitor && !apiBase()) { m.textContent = "✗ " + t("need_key"); return; }
  if (gk) { // 只测试密钥是否有效（列模型，不消耗识别额度）
    try { const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1", {headers:{"x-goog-api-key":gk}});
      m.textContent = r.ok ? t("set_ok") : "✗ "+t("err_key"); } catch { m.textContent = "✗ " + t("err_net"); }
    checkStatus(); return;
  }
  try {
    const r = await fetch(apiBase()+"/api/check", {method:"POST", headers:authHeaders()});
    m.textContent = r.ok ? t("set_ok") : (r.status===401 ? "✗ "+t("pw_wrong") : t("set_fail"));
  } catch { m.textContent = t("set_fail"); }
  checkStatus();
}
function shrink(file, max){
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = img.width*s; c.height = img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",.82));
    };
    img.onerror = () => bad(new Error(t("err_img"))); img.src = url;
  });
}
const STEP = 0.25;
function resultTotal(j){
  const its = j.items || [];
  if (!its.length) return j.total;
  const o = {kcal:0, protein:0, carbs:0, protein_:0, fat:0};
  its.forEach(i=>{ if (i.off) return; const m = i.m ?? 1; o.kcal+=i.kcal*m; o.protein+=(i.protein||0)*m; o.carbs+=(i.carbs||0)*m; o.fat+=(i.fat||0)*m; });
  return o;
}
function showResult(j, scroll){
  $("result").style.display = "block";
  const tot = resultTotal(j);
  $("rDish").textContent = j.dish || t("this_meal");
  $("rKcal").textContent = Math.round(tot.kcal);
  $("rConf").textContent = `${t("accuracy")}: ${t("conf")[j.confidence]||t("conf").medium} · ${t("hscore")} ${j.health_score}/10`;
  $("rItems").innerHTML = (j.items||[]).map((i,n)=>{ const m = i.m ?? 1;
    return `<div class="item${i.off?" off":""}"><div class="nm" style="min-width:0"><b>${esc(i.name)}</b><small>${esc(i.portion||"")}</small></div>
      <div class="step"><button onclick="adjItem(${n},-1)" aria-label="-">−</button><em>${Math.round(m*100)}%</em><button onclick="adjItem(${n},1)" aria-label="+">+</button>
      <b style="min-width:42px;text-align:right">${Math.round(i.kcal*m)}</b><button class="x" onclick="toggleItem(${n})">${i.off?"↺":"✕"}</button></div></div>`; }).join("");
  $("rMac").textContent = `${t("protein")} ${Math.round(tot.protein)}g · ${t("carbs")} ${Math.round(tot.carbs)}g · ${t("fat")} ${Math.round(tot.fat)}g`;
  $("rTip").textContent = "💡 " + (j.tip || "");
  document.querySelector("#result button[data-i18n=log_it]").disabled = tot.kcal<=0;
  if (scroll) { $("rMeal").value = guessMeal(); $("result").scrollIntoView({behavior:"smooth"}); }
}
function adjItem(n, dir){ const i = last.items[n]; i.m = Math.min(4, Math.max(STEP, Math.round(((i.m ?? 1) + dir*STEP)*100)/100)); showResult(last,false); }
function toggleItem(n){ const i = last.items[n]; i.off = !i.off; showResult(last,false); }
function resetItems(){ (last.items||[]).forEach(i=>{ i.m = 1; i.off = false; }); showResult(last,false); }
function saveResult(){
  const x = resultTotal(last);
  addEntry({name:last.dish||t("photo_meal"), meal:+$("rMeal").value, kcal:x.kcal, p:x.protein, c:x.carbs, f:x.fat});
  last = null; $("result").style.display = "none"; $("preview").style.display = "none"; go("today");
}
